<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#91c9cb">
    <title>Fair Attraction — Illes 23 Fair</title>
    <link rel="stylesheet" href="../css/console-ui.css">
    <link rel="stylesheet" href="../css/fair-map.css">
    <link rel="stylesheet" href="../css/mini-game-themes.css">
  </head>
  <body class="mini-game-body">
    <main class="mini-game-console console-shell" data-mini-game="attraction">
      <aside class="console-side console-side--left" aria-label="Attraction details">
        <section class="side-panel mini-game-side-panel">
          <h2 class="side-heading" id="mini-game-side-number">Fair Portal</h2>
          <p id="mini-game-side-title">Attraction</p>
        </section>
      </aside>
      <section class="console-main mini-game-main" aria-label="Attraction screen">
        <header class="screen-header">
          <a class="brand" href="../index.html" aria-label="Illes 23 Fair home">
            <img class="brand-sign" src="../UILetterSignCombo.svg" alt="">
            <span class="brand-title">ILLES <span>23</span> FAIR</span>
          </a>
          <div class="screen-tools">
            <p class="screen-status">Fair attraction</p>
            <a class="mini-game-return" href="../index.html">Return to fair</a>
          </div>
        </header>
        <section class="mini-game-screen" id="fair-attraction" data-mini-game="attraction" aria-labelledby="attraction-title">
          <div class="mini-game-card">
            <p class="welcome-label" id="attraction-number">Fair Attraction · WIP</p>
            <h1 id="attraction-title">Fair Attraction</h1>
            <p id="attraction-description">This attraction is being prepared. You can return to the fair and explore another area.</p>
          </div>
        </section>
        <footer class="screen-footer">
          <span>FAIR ATTRACTION</span>
          <span>ATTRACTION IN DEVELOPMENT</span>
        </footer>
      </section>
      <aside class="console-side console-side--right" aria-label="Attraction status">
        <section class="side-panel mini-game-side-panel">
          <h2 class="side-heading">Coming soon</h2>
          <p>The attraction will be added here.</p>
        </section>
      </aside>
    </main>
    <div class="flower-transition-backdrop" aria-hidden="true"></div>
    <div class="flower-curtain flower-curtain--left" aria-hidden="true"><img src="../assets/flower-curtain.svg" alt=""></div>
    <div class="flower-curtain flower-curtain--right" aria-hidden="true"><img src="../assets/flower-curtain.svg" alt=""></div>
    <script type="module" src="attraction-page.js"></script>
  </body>
</html>
